# Dependency update policy.
#
# Fixture and eval-module updates are grouped into 1 PR per ecosystem on a
# monthly schedule to bound maintenance load (plan requirement R9). Dependabot
# PRs run only the deterministic CI layers (example validation, fixture
# builds) per R14; agent-scenario breakage from a dependency bump is caught by
# the nightly full-matrix run.
#
# The fixture entries use the glob "/evals/custom/fixtures/*" so fixtures added
# later (U4) are picked up without config changes. Globs that currently match
# no directory containing a manifest for the ecosystem are a no-op; GitHub
# does not document this behavior explicitly, so check the Dependabot job
# logs after adding a new fixture ecosystem.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  # Eval harness module plus the Go fixture.
  - package-ecosystem: "gomod"
    directories:
      - "/evals/custom"
      - "/evals/custom/fixtures/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "fixtures"
    groups:
      fixtures:
        patterns:
          - "*"

  # Node.js fixture today; the nextjs and browser fixtures when U4 lands.
  - package-ecosystem: "npm"
    directories:
      - "/evals/custom/fixtures/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "fixtures"
    groups:
      fixtures:
        patterns:
          - "*"

  # The entries below activate when the matching U4 fixture directory lands.
  - package-ecosystem: "pip"
    directories:
      - "/evals/custom/fixtures/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "fixtures"
    groups:
      fixtures:
        patterns:
          - "*"
    ignore:
      # python-elasticsearch-service is the upgrade-scenario fixture: it
      # deliberately pins an old OpenTelemetry release line whose
      # elasticsearch instrumentation upstream retired, and upgrading past it
      # is the task under eval. Bumping these pins is doing the scenario's
      # job for the agent; change them only together with a review of the
      # scenario's premise (see evals/custom/scenarios/verify_dependencies.go).
      - dependency-name: "elasticsearch"
      - dependency-name: "opentelemetry-*"

  - package-ecosystem: "maven"
    directories:
      - "/evals/custom/fixtures/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "fixtures"
    groups:
      fixtures:
        patterns:
          - "*"

  - package-ecosystem: "bundler"
    directories:
      - "/evals/custom/fixtures/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "fixtures"
    groups:
      fixtures:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directories:
      - "/evals/custom/fixtures/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "fixtures"
    groups:
      fixtures:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directories:
      - "/evals/custom/fixtures/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "fixtures"
    groups:
      fixtures:
        patterns:
          - "*"

  # sbt supports version updates only (no security updates); see the GitHub
  # changelog entry of 2026-05-26 announcing sbt support.
  - package-ecosystem: "sbt"
    directories:
      - "/evals/custom/fixtures/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "fixtures"
    groups:
      fixtures:
        patterns:
          - "*"
