name: Package skills

# Builds one <skill>.zip and one <skill>.skill archive per directory under
# skills/ and attaches them to the GitHub release for the given tag. Called
# by release.yml after the release is created, and dispatchable by hand to
# retrofit a tag that was released before packaging existed (or to rebuild
# the assets without re-releasing; existing assets are overwritten).
#
# A .skill file is a zip archive with a different extension: the format
# Claude imports directly. Both archives hold a single top-level folder named
# after the skill, with SKILL.md directly inside it.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to package (e.g. v1.3.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v1.3.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package skills for ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Build archives
        run: |
          mkdir -p dist
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            if [ ! -f "skills/${skill_name}/SKILL.md" ]; then
              echo "::error::Skill '${skill_name}' is missing SKILL.md"
              exit 1
            fi
            # -X drops extra file attributes so identical content yields
            # identical archives; cd keeps the skill folder as the sole
            # top-level entry.
            (cd skills && zip -r -X "../dist/${skill_name}.zip" "${skill_name}")
            cp "dist/${skill_name}.zip" "dist/${skill_name}.skill"
          done
          ls -l dist

      - name: Verify archive layout
        run: |
          for archive in dist/*.zip dist/*.skill; do
            skill_name=$(basename "${archive%.*}")
            if ! unzip -Z1 "$archive" | grep -qx "${skill_name}/SKILL.md"; then
              echo "::error::${archive} does not contain ${skill_name}/SKILL.md"
              exit 1
            fi
            if unzip -Z1 "$archive" | grep -qv "^${skill_name}/"; then
              echo "::error::${archive} contains entries outside ${skill_name}/"
              exit 1
            fi
          done
          echo "Archive layout verified."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "${TAG}" dist/*.zip dist/*.skill \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
