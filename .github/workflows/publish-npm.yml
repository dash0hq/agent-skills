name: Publish to npm

# Publishes @dash0/agent-skills for an existing release tag. Dispatched by
# release.yml after the GitHub release is created, and dispatchable by hand
# to retrofit a tag that was released before npm publishing existed (or to
# retry a failed publish without re-releasing).
#
# Auth is OIDC trusted publishing (https://docs.npmjs.com/trusted-publishers):
# the package's trusted publisher on npmjs.com is pinned to this workflow
# file, so no npm token is involved. npm allows one trusted publisher per
# package and validates the top-level workflow's filename (a workflow_call
# entry would present the caller's filename), which is why release.yml
# dispatches this workflow instead of calling it as a reusable workflow —
# that keeps this file the single entry point for both paths.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.3.1)"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ensure package.json matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ ! -f package.json ]; then
            # Retrofit path: tags cut before the npm package existed carry no
            # package.json; take the manifest from main. The packed content
            # (skills/) still comes from the tag checkout.
            git fetch --depth 1 origin main
            git checkout FETCH_HEAD -- package.json
          fi
          # npm requires bare semver (no leading v).
          jq ".version = \"${TAG#v}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Verify publish exclusions
        run: |
          # R20 for the npm artifact: the package.json `files` allowlist ships only
          # skills/ (plus README, LICENSE, package.json); fail if the pack would
          # include evals/ or docs/ paths anyway.
          leaked=$(npm pack --dry-run --json | jq -r '[.[0].files[].path | select(test("^(evals|docs)/"))] | length')
          if [ "$leaked" != "0" ]; then
            npm pack --dry-run
            echo "::error::npm pack would include evals/ or docs/ paths; fix the package.json files allowlist before releasing"
            exit 1
          fi
          echo "npm publish exclusions verified: no evals/ or docs/ paths in the pack."

      - name: Publish to npm
        run: |
          # The job's OIDC id-token both authenticates the publish (via the
          # trusted publisher pinned to this workflow on npmjs.com) and
          # signs provenance. --provenance is explicit rather than relying
          # on the trusted-publishing default so a config regression fails
          # loudly instead of silently dropping attestations.
          npm publish --provenance --access public
