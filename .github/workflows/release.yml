name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # The release SHA is resolved once at dispatch: the eval matrix and the
  # publish both run against it, so the workflow's own version-bump commits
  # (which never touch skills/) stay outside the evaluated range.
  resolve:
    name: Pin release SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Resolve the dispatched HEAD SHA
        id: pin
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Release pinned to ${GITHUB_SHA}."

  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify skill structure
        run: |
          exit_code=0
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            if [ ! -f "$skill_dir/SKILL.md" ]; then
              echo "::error::Skill '$skill_name' is missing SKILL.md"
              exit_code=1
            fi
          done
          exit $exit_code

  # Release gate (R12): the full scenario matrix runs against the pinned SHA
  # (see evals-matrix.yml). This is the only place that runs the full matrix
  # now that the nightly schedule is gone; evals-matrix.yml's jobs read
  # ANTHROPIC_API_KEY as a repository secret rather than an environment-scoped
  # one, precisely so this run never blocks on a manual approval.
  evals:
    name: Eval full matrix
    needs: resolve
    uses: ./.github/workflows/evals-matrix.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  release:
    name: Create GitHub release
    needs:
      - resolve
      - validate
      - evals
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The SHA the eval matrix validated; bump commits are created on
          # top of it and pushed to the dispatched branch explicitly.
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Update plugin manifests
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for manifest in ".claude-plugin/plugin.json" ".cursor-plugin/plugin.json" "gemini-extension.json" ".tessl-plugin/plugin.json"; do
            jq ".version = \"${TAG}\"" "${manifest}" > "${manifest}.tmp"
            mv "${manifest}.tmp" "${manifest}"
            git add "${manifest}"
          done

          # npm requires bare semver (no leading v).
          jq ".version = \"${TAG#v}\"" package.json > package.json.tmp
          mv package.json.tmp package.json
          git add package.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Plugin manifests unchanged, skipping commit."
          else
            git commit -m "chore: update plugin manifests for ${TAG}"
            # HEAD is detached at the pinned SHA; push to the dispatched
            # branch explicitly.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Update CHANGELOG.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
        run: |
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          FEATS=""
          FIXES=""
          OTHER=""

          while IFS= read -r line || [ -n "$line" ]; do
            # Strip conventional commit prefix and optional scope for the summary
            summary=$(echo "$line" | sed -E 's/^[a-z]+(\([^)]*\))?!?: //')
            case "$line" in
              feat*)  FEATS="${FEATS}- ${summary}\n" ;;
              fix*)   FIXES="${FIXES}- ${summary}\n" ;;
              *)      OTHER="${OTHER}- ${summary}\n" ;;
            esac
          done < <(git log --pretty=format:"%s" "$RANGE")

          generate_entry() {
            echo "## ${TAG} ($(date +%Y-%m-%d))"
            echo ""
            if [ -n "$FEATS" ]; then
              echo "### Added"
              echo ""
              echo -e "$FEATS"
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixed"
              echo ""
              echo -e "$FIXES"
            fi
            if [ -n "$OTHER" ]; then
              echo "### Changed"
              echo ""
              echo -e "$OTHER"
            fi
          }

          if [ -f CHANGELOG.md ]; then
            {
              head -1 CHANGELOG.md
              echo ""
              generate_entry
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              generate_entry
            } > CHANGELOG.md
          fi

      - name: Commit changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged, skipping commit."
          else
            git commit -m "chore: update changelog for ${TAG}"
            # HEAD is detached at the pinned SHA; push to the dispatched
            # branch explicitly.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes

  # publish-npm, sync-website, and github-pages all run in parallel after the
  # GitHub release is created. Each is a separate dispatchable workflow so a
  # failed or timed-out step can be retried independently with the existing tag
  # without re-running the full release.
  #
  # Dispatched rather than called as reusable workflows: npm's trusted publisher
  # for @dash0/agent-skills is pinned to publish-npm.yml, and npm validates the
  # top-level workflow's filename — a workflow_call here would present release.yml
  # and be rejected. The same dispatch pattern is applied to sync-website.yml and
  # github-pages.yml for consistency. workflow_dispatch is one of the two event
  # types the default GITHUB_TOKEN is allowed to trigger, so none of these need a
  # PAT. Each dispatched run's outcome is reported on its own run, not on this one.
  publish-npm:
    name: Dispatch npm publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch publish-npm.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh workflow run publish-npm.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f tag="${TAG}"
          echo "Dispatched publish-npm.yml for ${TAG}; its result appears on that workflow's own run."

  sync-website:
    name: Dispatch website sync
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch sync-website.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh workflow run sync-website.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f tag="${TAG}"
          echo "Dispatched sync-website.yml for ${TAG}; its result appears on that workflow's own run."

  github-pages:
    name: Dispatch GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch github-pages.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh workflow run github-pages.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f tag="${TAG}"
          echo "Dispatched github-pages.yml for ${TAG}; its result appears on that workflow's own run."
