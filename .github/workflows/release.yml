name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # The release SHA is resolved once at dispatch: the eval matrix and the
  # publish both run against it, so the workflow's own version-bump commits
  # (which never touch skills/) stay outside the evaluated range.
  resolve:
    name: Pin release SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Resolve the dispatched HEAD SHA
        id: pin
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Release pinned to ${GITHUB_SHA}."

  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify skill structure
        run: |
          exit_code=0
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            if [ ! -f "$skill_dir/SKILL.md" ]; then
              echo "::error::Skill '$skill_name' is missing SKILL.md"
              exit_code=1
            fi
          done
          exit $exit_code

  # Release gate (R12): the full scenario matrix runs against the pinned SHA
  # the same way the nightly run does (see evals-matrix.yml).
  evals:
    name: Eval full matrix
    needs: resolve
    uses: ./.github/workflows/evals-matrix.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  release:
    name: Create GitHub release
    needs:
      - resolve
      - validate
      - evals
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The SHA the eval matrix validated; bump commits are created on
          # top of it and pushed to the dispatched branch explicitly.
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Update plugin manifests
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for manifest in ".claude-plugin/plugin.json" ".cursor-plugin/plugin.json" "gemini-extension.json" "tile.json"; do
            jq ".version = \"${TAG}\"" "${manifest}" > "${manifest}.tmp"
            mv "${manifest}.tmp" "${manifest}"
            git add "${manifest}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "plugin manifests unchanged, skipping commit."
          else
            git commit -m "chore: update plugin manifests for ${TAG}"
            # HEAD is detached at the pinned SHA; push to the dispatched
            # branch explicitly.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Update CHANGELOG.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
        run: |
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          FEATS=""
          FIXES=""
          OTHER=""

          while IFS= read -r line || [ -n "$line" ]; do
            # Strip conventional commit prefix and optional scope for the summary
            summary=$(echo "$line" | sed -E 's/^[a-z]+(\([^)]*\))?!?: //')
            case "$line" in
              feat*)  FEATS="${FEATS}- ${summary}\n" ;;
              fix*)   FIXES="${FIXES}- ${summary}\n" ;;
              *)      OTHER="${OTHER}- ${summary}\n" ;;
            esac
          done < <(git log --pretty=format:"%s" "$RANGE")

          generate_entry() {
            echo "## ${TAG} ($(date +%Y-%m-%d))"
            echo ""
            if [ -n "$FEATS" ]; then
              echo "### Added"
              echo ""
              echo -e "$FEATS"
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixed"
              echo ""
              echo -e "$FIXES"
            fi
            if [ -n "$OTHER" ]; then
              echo "### Changed"
              echo ""
              echo -e "$OTHER"
            fi
          }

          if [ -f CHANGELOG.md ]; then
            {
              head -1 CHANGELOG.md
              echo ""
              generate_entry
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              generate_entry
            } > CHANGELOG.md
          fi

      - name: Commit changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged, skipping commit."
          else
            git commit -m "chore: update changelog for ${TAG}"
            # HEAD is detached at the pinned SHA; push to the dispatched
            # branch explicitly.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify publish exclusions
        run: |
          # R20: published artifacts must exclude the eval harness and docs
          # (enforced by the repository-root .tesslignore; see RELEASE.md).
          if ! output=$(tessl tile publish . --dry-run --verbose 2>&1); then
            echo "$output"
            echo "::error::tessl tile publish --dry-run failed"
            exit 1
          fi
          echo "$output"
          if echo "$output" | grep -E '(^|[[:space:]"'"'"'])(\./)?(evals|docs)/' ; then
            echo "::error::tessl tile publish would include evals/ or docs/ paths; fix .tesslignore before releasing"
            exit 1
          fi
          echo "Publish exclusions verified: no evals/ or docs/ paths in the dry-run output."

      - name: Publish to Tessl
        run: |
          # Score the authored Tessl scenarios at publish time. --eval-scenarios
          # points the publisher at evals/tessl/ in the working tree; the packaged
          # tile still excludes all of evals/ (R20, verified above). See RELEASE.md.
          # NOTE: --eval-scenarios is documented on the modern `tessl skill publish`.
          # If the pinned CLI's `tile publish` rejects it, migrate the manifest with
          # `tessl plugin migrate` and switch to `tessl skill/plugin publish`.
          tessl tile publish . --eval-scenarios evals/tessl

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes
