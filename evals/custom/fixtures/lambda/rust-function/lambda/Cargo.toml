[package]
name = "checkout"
version = "0.1.0"
edition = "2024"
publish = false

# Lambda's provided.al2023 runtime starts the executable named bootstrap.
[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
lambda_runtime = "=1.5.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde_json = "=1.0.145"
tokio = { version = "=1.54.1", features = ["macros"] }
