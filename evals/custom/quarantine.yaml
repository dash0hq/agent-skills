# Quarantined eval scenarios (R16).
#
# Scenario IDs listed under `quarantine` never block a gate. The PR gate skips
# them entirely. The release matrix still runs them for observability, but as
# `continue-on-error` legs, so a failure is neutral and does not gate the
# release (see .github/workflows/evals-matrix.yml). Add an entry with the
# scenario ID, the date, and a link to the tracking issue; remove the entry
# once the scenario is stable again.
#
# Example:
#   quarantine:
#     - id: browser-http-basic
#       since: 2026-07-17
#       issue: https://github.com/dash0hq/agent-skills/issues/123
#
# History:
#   - instr-go-logs was un-quarantined on 2026-07-21: real runs show it passes
#     (the agent wires the slog->OTLP bridge itself).
#   - instr-dotnet-nuget was un-quarantined on 2026-07-22: three consecutive
#     real runs pass cleanly with no flake (the agent installs the NuGet
#     packages and wires the instrumentation itself). Any remaining skill-doc
#     gap for the .NET NuGet install path is tracked in TODO.md separately.
#
#   - k8s-deploy-otel-operator and k8s-deploy-dash0-operator were quarantined
#     on 2026-07-27 (issue #41) and un-quarantined on 2026-11-14. They failed
#     every release, not intermittently: the harness probed right after the
#     operator-triggered rollout started, while the old, uninstrumented pod
#     still served, so no SERVER span reached the sink. The harness now waits
#     for `kubectl rollout status` and checks every serving pod is injected.
quarantine: []
