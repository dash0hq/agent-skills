[package]
name = "dash0-rust-demo"
version = "0.1.0"
edition = "2024"
publish = false

# Lambda's provided.al2023 runtime starts the executable named bootstrap.
[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
http = "1"
lambda_runtime = "=1.5.0"
opentelemetry = "=0.33.1"
opentelemetry-aws = { version = "=0.21.0", default-features = false, features = ["detector-aws-lambda"] }
opentelemetry-http = "=0.33.1"
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = "=0.33.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
reqwest-middleware = "=0.5.2"
reqwest-tracing = "=0.7.1"
serde_json = "=1.0.145"
tokio = { version = "=1.54.1", features = ["macros"] }
tracing = "=0.1.44"
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { version = "=0.3.23", features = ["registry"] }
